function pull(n){const t=()=>{const r=Math.random();return r<.008?2:r<.22?1:0},a=[];for(let i=0;i<(n==5?5:1);i++)a.push(t());if(n==5&&!a.some(x=>x>=1))a[4]=1;return a}

function screen(){document.body.classList.toggle("ttl",scr=="title");
 const A=app,y=window.scrollY||0,bind=(s,f)=>A.querySelectorAll(s).forEach(b=>b.onclick=()=>f(b)),go=s=>{scr=s;screen()},bk='<button id="bk">뒤로</button>';
 if(scr=='title'){const sv=ls('rn-save');
  A.innerHTML=`<h1 style="font-size:48px;margin-top:28px">로그 노트</h1><p class="mut">웨이브를 넘어 끝까지. 최고 웨이브 ${best()}</p><div class="sheet menu">${[['cont','계속하기',!sv],['pick','새 게임'],['load','불러오기'],['egg','알 · 바우처 '+(vch()[0]+vch()[1])+' · 알 '+eggs().length],['hist','플레이 이력'],['set','설정']].map(([i,l,d])=>`<button data-i="${i}" ${d?'disabled':''}>${l}</button>`).join('')}</div>`;
  bind('[data-i]',b=>{const i=b.dataset.i;if(i=='cont'){try{G=JSON.parse(sv);G.balls=G.balls||[5,0,0,0];draw()}catch(e){ls('rn-save',null);G={};screen()}}else{if(i=='pick')PK.sel=[];if(i=='egg'){EG.res=null;EG.pull=null}go(i)}});return}
 if(scr=='pick'){const used=PK.sel.reduce((a,k)=>a+COST[k],0),f=PK.foc,m=mk(f,5),inn=PK.sel.includes(f),can=inn||(used+COST[f]<=10&&PK.sel.length<6);
  A.innerHTML=`<div class="top"><h2>스타터 선택</h2><b>${used}/10</b></div><div class="gauge">${[...Array(10)].map((_,i)=>`<i class="${i<used?'on':''}"></i>`).join('')}</div>
  ${`<div class="tabs"><button data-f="g">세대: ${PK.g?PK.g+"세대":"전체"}</button><button data-f="t">타입: ${PK.t?TY[PK.t][0]:"전체"}</button></div>`}<div class="sheet"><div class="pic big">${art(f)}</div><div class="top"><b>No.${String(DEX[f]).padStart(4,'0')} ${nm(m)}</b><span>비용 ${COST[f]}</span></div>${[...m.t].map(tag).join('')}<small>HP ${m.b[0]} 공격 ${m.b[1]} 방어 ${m.b[2]} 속도 ${m.b[3]}</small><div class="mvb">${m.mv.map(k=>`<span style="background:${TY[MV[k][0]][1]}">${MN[k]}</span>`).join('')}</div><small>선택: ${PK.sel.map(k=>NM[k]).join(', ')||'없음'} (최대 6마리) · 잡아서 해금한 포켓몬 ${col().length}종</small><button id="ad" class="go" style="width:100%;margin-top:8px" ${can?'':'disabled'}>${inn?'파티에서 빼기':'파티에 추가'}</button></div>
  <div class="dex">${list().map(k=>`<button data-k="${k}" class="${k==f?'foc':''} ${PK.sel.includes(k)?'sel':''}"><small>${COST[k]}</small><span class="pic">${art(k)}</span><span>${NM[k]}</span></button>`).join('')}</div>
  <div class="g2"><button id="rd">랜덤</button><button id="st" class="go" ${PK.sel.length?'':'disabled'}>${used}/10 시작</button></div>${bk}`;
  window.scrollTo(0,y);bind('[data-f]',b=>{if(b.dataset.f=='g')PK.g=((PK.g||0)+1)%10;else{const ks=['',...Object.keys(TY)];PK.t=ks[(ks.indexOf(PK.t||'')+1)%ks.length]}screen()});bind('[data-k]',b=>{PK.foc=b.dataset.k;screen()});
  document.getElementById('ad').onclick=()=>{PK.sel=inn?PK.sel.filter(k=>k!=f):[...PK.sel,f];screen()};
  document.getElementById('rd').onclick=()=>{let u=0;PK.sel=[];for(const k of shuf(avail())){if(PK.sel.length<6&&u+COST[k]<=10){PK.sel.push(k);u+=COST[k]}}screen()};
  document.getElementById('st').onclick=()=>start(PK.sel)}
 else if(scr=='egg'){const E=eggs(),Z=EG.res,V=vch(),Q=EG.pull,hd='<h2>알</h2>';
  if(Z)A.innerHTML=`${hd}<div class="sheet" style="text-align:center"><div class="pic" style="width:128px;height:128px;margin:0 auto">${art(Z.k)}</div><h2>${NM[Z.k]}</h2><b>${Z.nw?'새로운 포켓몬을 얻었다! 다음 판부터 스타터로 쓸 수 있다.':'이미 가진 포켓몬이다.'}</b><br><small>${EN[Z.t]} 알 · No.${String(DEX[Z.k]).padStart(4,'0')}</small></div><button id="ok" class="go" style="width:100%">확인</button>`;
  else if(Q)A.innerHTML=`${hd}<div class="sheet" style="text-align:center"><b>알을 뽑았다!</b><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px">${Q.map(t=>`<div>${eggSvg(t)}<br><small>${EN[t]} 알</small></div>`).join('')}</div></div><button id="ok2" class="go" style="width:100%">확인</button>`;
  else A.innerHTML=`${hd}<div class="sheet"><small>바우처는 웨이브 보상에서 얻습니다(보스 웨이브에는 반드시 나옵니다). 바우처로 알을 뽑고, 알을 눌러 부화시키세요. 알은 커먼 / 레어 / 하이퍼가 있고, 전설의 포켓몬은 하이퍼 알에서만 확정으로 나옵니다. 다른 알에서는 나오지 않습니다.</small></div><div class="g2"><button data-v="1" ${V[0]?'':'disabled'}>기본 바우처 ×${V[0]}<br><small>알 1개 뽑기</small></button><button data-v="5" ${V[1]?'':'disabled'}>플러스 바우처 ×${V[1]}<br><small>알 5개 뽑기 (레어 이상 보장)</small></button></div><div class="sheet"><b>가진 알 ${E.length}개</b> <small>눌러서 부화</small></div>${E.length?`<div class="g2">${E.map((t,i)=>`<button data-e="${i}" style="text-align:center">${eggSvg(t)}<br>${EN[t]} 알</button>`).join('')}</div>`:''}${bk}`;
  bind('[data-e]',b=>{const a=eggs(),t=a.splice(+b.dataset.e,1)[0];saveEggs(a);const k=hatch(t);EG.res={k,t,nw:addCol(k)};screen()});
  bind('[data-v]',b=>{const v=vch(),i=b.dataset.v=='5'?1:0;if(!v[i])return;v[i]--;saveV(v);const q=pull(+b.dataset.v);saveEggs([...eggs(),...q]);EG.pull=q;screen()});
  const ok=document.getElementById('ok');if(ok)ok.onclick=()=>{EG.res=null;screen()};const o2=document.getElementById('ok2');if(o2)o2.onclick=()=>{EG.pull=null;screen()}}
 else if(scr=='hist'){const H=JSON.parse(ls('rn-hist')||'[]');A.innerHTML=`<h2>플레이 이력</h2>${H.length?H.map(r=>`<div class="sheet"><b>웨이브 ${r.w}</b> <small>${r.d}</small><br>${r.p.map(k=>NM[k]).join(', ')}</div>`).join(''):'<div class="sheet">아직 기록이 없습니다. 새 게임을 시작해 보세요.</div>'}${bk}`}
 else if(scr=='load'){const sv=ls('rn-save');A.innerHTML=`<h2>불러오기</h2><div class="sheet">진행 코드를 복사해 두면 다른 기기에서 이어서 할 수 있습니다.</div><textarea id="cd" placeholder="진행 코드를 붙여넣으세요"></textarea><div class="g2"><button id="ex" ${sv?'':'disabled'}>코드 내보내기</button><button id="im" class="go">불러오기</button></div><p id="ms" class="mut"></p>${bk}`;
  document.getElementById('ex').onclick=()=>{document.getElementById('cd').value=btoa(sv)};
  document.getElementById('im').onclick=()=>{try{const o=JSON.parse(atob(document.getElementById('cd').value.trim()));if(!o.party||!o.ph||o.ph=='over')throw 0;o.balls=o.balls||[5,0,0,0];G=o;persist();draw()}catch(e){document.getElementById('ms').textContent='코드를 읽을 수 없습니다. 내보내기로 만든 코드를 그대로 붙여넣어 주세요.'}}}
 else if(scr=='set'){A.innerHTML=`<h2>설정</h2><div class="sheet">화면 색상</div><div class="g2"><button data-t="">자동</button><button data-t="light">라이트</button><button data-t="dark">다크</button><button id="rs">기록 모두 지우기</button></div><p id="ms" class="mut"></p>${bk}`;
  bind('[data-t]',b=>{ls('rn-theme',b.dataset.t||null);applyTheme()});
  document.getElementById('rs').onclick=()=>{['rn-save','rn-hist','rn-best','rn-col','rn-egg','rn-vch'].forEach(k=>ls(k,null));document.getElementById('ms').textContent='지웠습니다.'}}
 const b=document.getElementById('bk');if(b)b.onclick=()=>go('title')}
applyTheme();draw();
(function(){
const vis=()=>[...app.querySelectorAll('button:not(:disabled)')].filter(b=>b.offsetParent);
const key=b=>b.dataset.k?'k'+b.dataset.k:b.id||Object.entries(b.dataset).join()||b.textContent;
let last=null;
const fix=()=>{const v=vis();if(!v.length)return;const a=document.activeElement;if(v.includes(a))return;const t=v.find(b=>key(b)==last)||v[0];t.focus({preventScroll:true});t.scrollIntoView({block:'nearest'})};
new MutationObserver(fix).observe(app,{childList:true});
addEventListener('keydown',e=>{
 if(e.target.tagName=='TEXTAREA'||e.ctrlKey||e.metaKey||e.altKey)return;
 const k=e.key.toLowerCase(),D={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];
 const v=vis(),cur=v.includes(document.activeElement)?document.activeElement:null;
 if(D){e.preventDefault();if(!cur){fix();return}
  const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e9;
  for(const b of v){if(b==cur)continue;const q=b.getBoundingClientRect(),dx=q.left+q.width/2-cx,dy=q.top+q.height/2-cy,m=D[0]?dx*D[0]:dy*D[1],o=D[0]?Math.abs(dy):Math.abs(dx);if(m<=4)continue;const s=m+o*2.5;if(s<bs){bs=s;best=b}}
  if(best){last=key(best);best.focus({preventScroll:true});best.scrollIntoView({block:'nearest'});if(best.dataset.k)best.click()}
  return}
 if(k==' '||k=='enter'){e.preventDefault();if(!cur){fix();return}
  last=key(cur);const ad=document.getElementById('ad');
  if(cur.dataset.k&&ad&&!ad.disabled)ad.click();else cur.click();return}
 if(k=='escape'||k=='backspace'){const b=document.getElementById('bk')||app.querySelector('[data-c=x]');if(b){e.preventDefault();b.click()}}
});
addEventListener('keyup',e=>{if(e.key==' ')e.preventDefault()});
fix();
})();
